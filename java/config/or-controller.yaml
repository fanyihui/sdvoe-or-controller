# 本控制器所属手术室 + SDVoE 设备发现配置

operating_room:
  id: OR-01
  name: 1号手术室
  building: 外科楼
  floor: 3F

# 路由持久化（SQLite）；可用环境变量 OR_DESK_DB 覆盖路径
database:
  path: data/or-desk.db
  restore_routes_on_startup: true

sdvoe:
  discovery:
    # inventory | mock | http
    # 首期默认 inventory：以交付清单为准；联调无硬件时可改为 mock
    mode: inventory
    # mode=http 时启用：
    # manager_base_url: http://10.10.1.5:8088

  # 本手术室 SDVoE 设备交付清单（mode=inventory 时使用）
  inventory:
    - id: enc-endo-01
      name: 腔镜编码器
      or_id: OR-01
      role: ENCODER
      ip: 10.10.1.11
      mac: "00:0A:1B:10:01:11"
      model: SDVoE-ENC-4K
      firmware: 2.4.1
      location: 吊塔-视频输入柜
      status: ONLINE
      signal_present: true
      stream_id: stream-endo-main
      tags:
        source: endoscope

    - id: enc-cam-02
      name: 术野相机编码器
      or_id: OR-01
